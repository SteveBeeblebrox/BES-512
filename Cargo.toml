[workspace]
resolver = "2"
members = ["main", "core"]

[workspace.package]
version = "0.1.0"
authors = ["Trin Wasinger"]
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5.34", features = ["cargo", "derive"] }
konst = "0.3.16"
anyhow = "1.0.97"
strum = { version = "0.27.1", features = ["derive"] }
enum-assoc = "1.2.4"
bes-512-core = { path = "core" }

[profile.release.package.bes-512-core]
opt-level=0