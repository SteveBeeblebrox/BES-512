[workspace]
resolver = "2"
members = ["cli", "core"]

[workspace.package]
version = "0.1.0"
authors = ["Trin Wasinger"]
edition = "2024"

[workspace.dependencies]
clap = { version = "4.5.34", features = ["cargo"] }
konst = "0.3.16"
bes-512-core = { path = "core" }

[profile.release.package.bes-512-core]
opt-level=0